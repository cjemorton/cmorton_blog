<ul class="social-media-list">
  {%- if site.github_username -%}
  <li><a href="https://github.com/{{ site.github_username| cgi_escape | escape }}" rel="noopener noreferrer" target="_blank"><span class="social-icon">🔗</span> <span class="username">{{ site.github_username| escape }}</span></a></li>
  {%- endif -%}
  {%- if site.twitter_username -%}
  <li><a href="https://twitter.com/{{ site.twitter_username| cgi_escape | escape }}" rel="noopener noreferrer" target="_blank"><span class="social-icon">🔗</span> <span class="username">{{ site.twitter_username| escape }}</span></a></li>
  {%- endif -%}
  <li><a href="{{ "/feed.xml" | relative_url }}"><span class="social-icon">📰</span> <span>{{ site.rss | default: "Subscribe" | escape }}</span></a></li>
</ul>
